<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports — Pharmacy Admin</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="../css/pwa-install.css" />
    <meta name="theme-color" content="#1f4d3d" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="../css/variables.css" />
    <script>
        (function () {
            var primary = localStorage.getItem('pharmacy_theme_color');
            var dark = localStorage.getItem('pharmacy_theme_dark');
            var light = localStorage.getItem('pharmacy_theme_light');
            var pale = localStorage.getItem('pharmacy_theme_pale');
            if (primary) document.documentElement.style.setProperty('--green-primary', primary);
            if (dark) document.documentElement.style.setProperty('--green-dark', dark);
            if (light) document.documentElement.style.setProperty('--green-light', light);
            if (pale) document.documentElement.style.setProperty('--green-pale', pale);
        })();
    </script>

    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/pos.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-row">
                <div class="brand-logo-wrap">
                    <img id="brand-logo" alt="Pharmacy logo" />
                    <span id="brand-icon-fallback" style="color:white;"></span>
                </div>
                <div id="brand-name">Pharmacy Admin</div>
                <script>
                    (function () {
                        try {
                            var cached = JSON.parse(localStorage.getItem('pharmacy_brand_cache') || 'null');
                            if (!cached) return;
                            var nameEl = document.getElementById('brand-name');
                            if (nameEl && cached.name) nameEl.textContent = cached.name;
                            var logoEl = document.getElementById('brand-logo');
                            if (logoEl && cached.logo_url) {
                                logoEl.src = cached.logo_url;
                                logoEl.style.display = 'block';
                                var fallback = document.getElementById('brand-icon-fallback');
                                if (fallback) fallback.style.display = 'none';
                            }
                        } catch (e) { }
                    })();
                </script>
            </div>
            <nav>
                <a href="admin-dashboard.html" id="nav-dashboard">Dashboard</a>
                <a href="admin-inventory.html" id="nav-inventory">Inventory</a>
                <a href="admin-reports.html" class="active" id="nav-reports">Reports</a>
                <a href="admin-suppliers.html" id="nav-suppliers">Suppliers</a>
                <a href="admin-staff.html" id="nav-staff">Staff</a>
                <a href="admin-audit.html" id="nav-audit">Audit Log</a>
                <a href="admin-settings.html" id="nav-settings">Settings</a>
                <a href="#" id="logout-link">Log Out</a>
            </nav>
            <div class="sync-status" id="sync-status"><span class="sync-dot"></span><span id="sync-status-text">Checking
                    sync…</span></div>
        </aside>

        <main class="main">
            <div class="topbar">
                <h1 id="page-title">Sales Reports</h1>
                <div class="muted" id="admin-name"></div>
            </div>

            <div class="report-tabs">
                <button class="tab-btn active" id="tab-sales" type="button">Sales</button>
                <button class="tab-btn" id="tab-shifts" type="button">Shifts</button>
            </div>

            <div class="card" style="margin-bottom:16px;">
                <div class="admin-toolbar" style="margin-bottom:0;">
                    <div class="field" style="flex:1; min-width:150px; margin-bottom:0;">
                        <label for="filter-from">From</label>
                        <input id="filter-from" type="date" />
                    </div>
                    <div class="field" style="flex:1; min-width:150px; margin-bottom:0;">
                        <label for="filter-to">To</label>
                        <input id="filter-to" type="date" />
                    </div>
                    <div class="field" style="flex:1; min-width:180px; margin-bottom:0;">
                        <label for="filter-cashier">Cashier</label>
                        <select id="filter-cashier">
                            <option value="">All cashiers</option>
                        </select>
                    </div>
                    <div class="field" id="flagged-field" style="display:none; margin-bottom:0; align-self:flex-end;">
                        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:normal;">
                            <input type="checkbox" id="filter-flagged" /> Flagged only
                        </label>
                    </div>
                    <button class="btn-icon" id="apply-filter-btn" style="align-self:flex-end;"></button>
                </div>
            </div>

            <div class="admin-stat-grid" id="report-stat-grid"></div>

            <div class="card">
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead id="report-thead">
                            <tr>
                                <th>Date/Time</th>
                                <th>Ref</th>
                                <th>Cashier</th>
                                <th>Payment</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="report-tbody">
                            <tr>
                                <td colspan="6" class="muted">Loading…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/pwa-update.js"></script>
    <script src="../js/admin/reports.js"></script>
</body>

</html>
