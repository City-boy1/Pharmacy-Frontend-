<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers — Pharmacy Admin</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="../css/pwa-install.css" />
    <meta name="theme-color" content="#1f4d3d" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/pos.css" />
    <link rel="stylesheet" href="../css/admin.css" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-row">
                <div class="brand-logo-wrap">
                    <img id="brand-logo" alt="Pharmacy logo" />
                    <span id="brand-icon-fallback" style="color:white;"></span>
                </div>
                <div id="brand-name">Pharmacy Admin</div>
            </div>
            <nav>
                <a href="admin-dashboard.html" id="nav-dashboard">Dashboard</a>
                <a href="admin-inventory.html" id="nav-inventory">Inventory</a>
                <a href="admin-reports.html" id="nav-reports">Reports</a>
                <a href="admin-suppliers.html" class="active" id="nav-suppliers">Suppliers</a>
                <a href="admin-staff.html" id="nav-staff">Staff</a>
                <a href="admin-audit.html" id="nav-audit">Audit Log</a>
                <a href="admin-settings.html" id="nav-settings">Settings</a>
                <a href="#" id="logout-link">Log Out</a>
            </nav>
            <div class="sync-status" id="sync-status"><span class="sync-dot"></span><span id="sync-status-text">Checking
                    sync…</span></div>
        </aside>

        <main class="main">
            <div class="topbar">
                <h1>Suppliers</h1>
                <div class="muted" id="admin-name"></div>
            </div>

            <div class="admin-toolbar">
                <div class="search-input-wrap"></div>
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; white-space:nowrap;">
                    <input type="checkbox" id="show-inactive-toggle" style="width:auto;" />
                    Show deactivated
                </label>
                <button class="btn-icon" id="add-supplier-btn"></button>
            </div>

            <div class="card">
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Contact Info</th>
                                <th>Added</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="suppliers-tbody">
                            <tr>
                                <td colspan="3" class="muted">Loading…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Supplier Modal -->
    <div class="modal-overlay" id="supplier-modal" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Add Supplier</h3>
                <button class="modal-close" id="supplier-modal-close"></button>
            </div>
            <div class="field">
                <label for="sup-name">Supplier Name *</label>
                <input id="sup-name" placeholder="e.g. Ernest Chemists Ltd" />
            </div>
            <div class="field">
                <label for="sup-contact">Contact Info</label>
                <input id="sup-contact" placeholder="Phone, email, or address" />
            </div>
            <div style="display:flex; gap:8px; margin-top:16px;">
                <button class="btn-secondary" id="supplier-cancel-btn" style="flex:1;">Cancel</button>
                <button id="supplier-save-btn" style="flex:1;">Save Supplier</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/icons.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/pwa-install.js"></script>
    <script src="../js/pwa-update.js"></script>
    <script src="../js/admin/suppliers.js"></script>
</body>

</html>
