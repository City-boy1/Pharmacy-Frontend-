<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Held orders · Pharmacy</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="../css/pwa-install.css" />
    <meta name="theme-color" content="#1f4d3d" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="stylesheet" href="../css/variables.css">
    <script>
        (function () {
            var primary = localStorage.getItem('pharmacy_theme_color');
            var dark = localStorage.getItem('pharmacy_theme_dark');
            var light = localStorage.getItem('pharmacy_theme_light');
            var pale = localStorage.getItem('pharmacy_theme_pale');
            if (primary) document.documentElement.style.setProperty('--green-primary', primary);
            if (dark) document.documentElement.style.setProperty('--green-dark', dark);
            if (light) document.documentElement.style.setProperty('--green-light', light);
            if (pale) document.documentElement.style.setProperty('--green-pale', pale);
        })();
    </script>

    <link rel="stylesheet" href="../css/layout.css">
    <script src="../js/vendor/dexie.min.js"></script>
</head>

<body>
    <div class="pos-shell">
        <header class="pos-topbar">
            <strong>Held orders</strong>
            <a href="pos.html" class="btn btn-secondary">Back to POS</a>
        </header>
        <div class="content" style="max-width: 720px; margin: 0 auto; width: 100%;">
            <p class="text-muted">Orders held from the POS screen appear here. Resume one to bring it back into the
                cart, or discard it.</p>
            <div id="held-orders-list"></div>
        </div>
    </div>

    <script src="../js/db.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/pos/cart.js"></script>
    <script src="../js/pos/held-orders.js"></script>
</body>

</html>
